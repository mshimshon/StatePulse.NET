name: Deploy Documentation

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
            node-version: '>=18.0'

      - name: Install dependencies and build
        run: |
            cd ./doc
            npm ci
            npm run build

      - name: Sync and wipe old files on R2
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: us-east-1  # Required dummy value for AWS CLI, Cloudflare ignores it
        run: |
            aws s3 sync ./doc/build s3://statepulse-documentation \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --delete

