name: Deploy Documentation

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write
      actions: write
      contents: write


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
            node-version: '>=18.0'

      - name: Install dependencies and build
        shell: bash
        run: |
            cd ./doc
            npm ci
            npm run build

      - name: Checkout Documentation branch to /tmp/main-doc
        uses: actions/checkout@v4
        with:
            ref: 'main-doc' # Replace with your target branch name
            path: '/tmp/main-doc'
            fetch-depth: 0 # Disables shallow cloning and fetches all history

      - name: Prepare .doc-dist folder
        shell: bash
        run: |
            if [ -d "/tmp/main-doc/.doc-dist" ]; then
            rm -rf "/tmp/main-doc/.doc-dist"
            fi
            mkdir -p "/tmp/main-doc/.doc-dist"

      - name: Copy build files
        run: cp -r ./doc/build/. /tmp/main-doc/.doc-dist/

      - name: Pushing New Documentation
        shell: bash
        run: |
          cd /tmp/main-doc
          if [ -n "$(git status --porcelain .doc-dist)" ]; then
            echo "Content detected. Committing and force pushing changes..."
            git add .doc-dist
            git commit -m "trace!: Update documentation build"
            git push origin HEAD:main-doc --force
          else
            echo "No changes or content detected in .doc-dist. Skipping push."
          fi

